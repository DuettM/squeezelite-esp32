# In deinem Fork anlegen als:  .github/workflows/build-wifi-fix.yml
name: Build I2S-4MFlash (wifi-fix)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 15
      - name: WLAN-Fix-Patch schreiben und anwenden
        run: |
          echo "" | base64 -d > wifi-reconnect-reboot.patch
          git apply --verbose wifi-reconnect-reboot.patch
      - name: Skripte ausfuehrbar machen
        run: |
          chmod +x ./buildFirmware.sh ./server_certs/getcert.sh 2>/dev/null || true
          chmod +x ./components/spotify/cspot/bell/external/nanopb/generator/protoc* 2>/dev/null || true
          chmod +x ./components/spotify/cspot/bell/external/nanopb/generator/*.py* 2>/dev/null || true
      - name: OTA-Zertifikat holen
        run: cd server_certs && ./getcert.sh || true
      - name: Firmware bauen (Fehler = rot)
        run: |
          docker pull sle118/squeezelite-esp32-idfv448:4.4.8
          docker run -v "$PWD":/project -w /project sle118/squeezelite-esp32-idfv448:4.4.8 \
            /bin/bash -c "python3 -m pip install protobuf==3.20.3 grpcio-tools==1.48.2 && cp build-scripts/I2S-4MFlash-sdkconfig.defaults sdkconfig && idf.py build -DDEPTH=16 -DBUILD_NUMBER=wififix-16"
      - name: Pruefen, dass die App wirklich gebaut wurde
        run: |
          echo "--- build/ Inhalt:"; ls -la build/*.bin build/bootloader/bootloader.bin build/partition_table/partition-table.bin 2>/dev/null || true
          test -f build/squeezelite.bin || { echo "FEHLER: build/squeezelite.bin fehlt - App nicht gebaut"; exit 1; }
          test -f build/recovery.bin   || { echo "FEHLER: build/recovery.bin fehlt"; exit 1; }
          echo "OK: App-Binaerdateien vorhanden."
      - name: build_output.zip packen
        run: zip -r build_output.zip build >/dev/null
      - name: Release mit .bin erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wifi-fix
          name: squeezelite-esp32 I2S-4MFlash (wifi-fix)
          body: "WLAN-Reconnect-Fix (#520) + Selbst-Neustart (wifitmout) + Roaming auf staerksten AP."
          files: |
            build/squeezelite.bin
            build/recovery.bin
            build/ota_data_initial.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_project_args
            build_output.zip
