# In deinem Fork anlegen als:  .github/workflows/build-wifi-fix.yml
name: Build I2S-4MFlash (wifi-fix)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 15
      - name: WLAN-Fix-Patch schreiben und anwenden
        run: |
          echo "" | base64 -d > wifi-reconnect-reboot.patch
          git apply --verbose wifi-reconnect-reboot.patch
      - name: Skripte ausfuehrbar machen
        run: |
          chmod +x ./buildFirmware.sh ./server_certs/getcert.sh 2>/dev/null || true
          chmod +x ./components/spotify/cspot/bell/external/nanopb/generator/protoc* 2>/dev/null || true
          chmod +x ./components/spotify/cspot/bell/external/nanopb/generator/*.py* 2>/dev/null || true
      - name: OTA-Zertifikat holen
        run: cd server_certs && ./getcert.sh || true
      - name: Firmware im Docker-Image bauen
        run: |
          docker pull sle118/squeezelite-esp32-idfv4-master
          docker run -e TARGET_BUILD_NAME=I2S-4MFlash -e DEPTH=16 -e BUILD_NUMBER=wififix -e artifact_file_name=squeezelite-esp32-I2S-4MFlash-wififix.zip -v "$PWD":/project -w /project sle118/squeezelite-esp32-idfv4-master /bin/bash -c "./buildFirmware.sh"
      - name: Build-Dateien anzeigen
        run: ls -la build/*.bin build/bootloader/bootloader.bin build/partition_table/partition-table.bin build/flash_project_args 2>/dev/null || true
      - name: Release mit .bin erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wifi-fix
          name: squeezelite-esp32 I2S-4MFlash (wifi-fix)
          body: "WLAN-Reconnect-Fix plus WLAN-Selbst-Neustart."
          files: |
            build/squeezelite.bin
            build/recovery.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_project_args
            build/squeezelite-esp32-I2S-4MFlash-wififix.zip
            build_output.zip
